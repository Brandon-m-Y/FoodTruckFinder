# Netlify deploy config.
#
# There is no build step — the frontend is hand-written ES modules and plain CSS,
# served as-is. `npm install` still runs so the function can import
# @supabase/supabase-js, but nothing is compiled or bundled by us.
#
# THIS FILE LIVES AT THE REPOSITORY ROOT, NOT IN truckmap/
# Netlify looks for netlify.toml in the base directory — so if this file were
# inside truckmap/, Netlify could only find it once you had already told the UI
# that base is truckmap. Config that can only be read after you have configured
# the thing it configures. Keeping it at the root means `base` below is
# authoritative and the Netlify UI needs no build settings at all.

[build]
  # Everything below is resolved RELATIVE TO base, so these stay short.
  base    = "truckmap"
  publish = "frontend"

  # Netlify already runs an automatic `npm install` when it finds package.json.
  # This second pass drops devDependencies — the Supabase CLI is ~50MB and is a
  # local schema-migration tool, never something the deployed site executes.
  command = "npm install --omit=dev"

  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # handlers.mjs lives outside the functions directory and is shared with the
  # local dev server, so it has to be pulled into the bundle explicitly.
  included_files = ["server/**"]

# /api/* is claimed by the function's own `config.path` export, so no redirect
# rule is needed here. Declaring one as well would shadow it.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Geolocation is used by the "Use my location" button on the add-truck form.
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"

    # Content Security Policy — an allowlist of every origin the page may reach.
    #
    # This is the backstop for the supply-chain risk that motivated dropping the
    # Supabase client library from the browser. Leaflet is the only third-party
    # SCRIPT left, and it is already pinned with a subresource-integrity hash, so
    # a compromised unpkg cannot alter it. The CSP means that even if some other
    # injected code did run, it could not phone home: connect-src permits exactly
    # one external host.
    #
    # Every entry below is load-bearing. In order:
    #   script-src   unpkg = Leaflet (SRI-pinned); challenges.cloudflare.com =
    #                Turnstile, loaded lazily and only when a sitekey exists.
    #   style-src    'unsafe-inline' is unavoidable: Leaflet positions every tile
    #                and marker with element.style, which CSP treats as inline.
    #                It applies to styles only, never to script.
    #   img-src      OSM raster tiles; data: for Leaflet's inline 1x1 GIFs;
    #                unpkg for the marker sprites leaflet.css references.
    #   connect-src  the Supabase project (PostgREST reads), 'self' (/api/*
    #                writes), and Turnstile. That last one is NOT decoration:
    #                the widget calls home, and with only script-src and
    #                frame-src listed the policy looks correct locally — because
    #                the always-pass TEST keys render nothing — and then breaks
    #                the moment real keys go live. No analytics, no beacons.
    #   frame-src    Turnstile renders its challenge in an iframe.
    #   frame-ancestors 'none' stops this map being embedded to phish sightings.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com https://challenges.cloudflare.com; style-src 'self' https://unpkg.com 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://detmkrivpmfljqfazdzx.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Static assets are fingerprint-free, so they must revalidate — a cached
# config.js holding a rotated Supabase key would break the map until the
# browser happened to refetch.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
